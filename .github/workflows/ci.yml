name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + pruebas)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sportreserve_test
          POSTGRES_USER: sportreserve_user
          POSTGRES_PASSWORD: sportreserve_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportreserve_user -d sportreserve_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB_TEST: sportreserve_test
      POSTGRES_USER: sportreserve_user
      POSTGRES_PASSWORD: sportreserve_ci_password
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      RATE_LIMIT_ENABLED: "false"
      BCRYPT_ROUNDS: "10"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

  frontend:
    name: Frontend (lint + pruebas + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build de producción
        run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen del backend
        run: docker build -f backend/Dockerfile -t sportreserve-backend:ci .

      - name: Construir imagen del frontend
        run: docker build -t sportreserve-frontend:ci ./frontend
