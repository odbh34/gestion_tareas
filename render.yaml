# Blueprint de Render para el backend en el plan gratuito.
# La base de datos vive en Neon (el PostgreSQL gratuito de Render caduca a los
# 30 días) y el frontend se despliega en Vercel.
#
# Uso: Render Dashboard > New > Blueprint > selecciona este repositorio.
# Render pedirá DATABASE_URL y CORS_ORIGINS; el resto se configura solo.
services:
  - type: web
    name: sportreserve-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      # No cambiar hasta medir la cadena real con LOG_FORWARDED_FOR.
      - key: TRUST_PROXY
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOCKOUT_THRESHOLD
        value: '5'
      - key: LOCKOUT_BASE_SECONDS
        value: '60'
      - key: LOCKOUT_MAX_SECONDS
        value: '900'
      - key: LOG_FORWARDED_FOR
        value: 'false'
      - key: RESET_TOKEN_TTL_MINUTES
        value: '15'
      # Sin SMTP el restablecimiento queda inoperante en producción; el
      # endpoint responde igual y no se envía nada. Dejar vacío si no se usa.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '2525'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: 'SportReserve Tasks <no-reply@sportreserve.local>'
