# Blueprint de Render para el backend en el plan gratuito.
# La base de datos vive en Neon (el PostgreSQL gratuito de Render caduca a los
# 30 días) y el frontend se despliega en Vercel.
#
# Uso: Render Dashboard > New > Blueprint > selecciona este repositorio.
# Render pedirá DATABASE_URL y CORS_ORIGINS; el resto se configura solo.
services:
  - type: web
    name: sportreserve-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
